<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randomized Polaroid Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Randomized Cards</h1>
      <p>Click next to drop a new card into the stack.</p>
      <section class="card-stack" id="cardStack" aria-live="polite" aria-label="Color card stack"></section>
      <button class="next-button" id="nextButton" type="button">Next card in 15s</button>
    </main>

    <template id="cardTemplate">
      <article class="polaroid-card">
        <div class="artwork-wrap">
          <div class="artwork" role="img"></div>
          <p class="card-text"></p>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
