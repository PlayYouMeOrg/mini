<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base href="$FLUTTER_BASE_HREF">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>mini</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111827;
    }
    body {
      position: fixed;
      inset: 0;
    }
    body > flt-glass-pane,
    body > .flt-glass-pane,
    body > flutter-view {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    // Prevent use of deprecated Intl.v8BreakIterator by providing a Segmenter-backed shim.
    (function () {
      if (!window.Intl || typeof window.Intl.Segmenter !== 'function') {
        return;
      }

      function resolveGranularity(options) {
        switch (options && options.type) {
          case 'character':
            return 'grapheme';
          case 'sentence':
            return 'sentence';
          case 'line':
          case 'word':
          default:
            return 'word';
        }
      }

      function SegmenterBreakIterator(locales, options) {
        const segmenter = new window.Intl.Segmenter(locales, {
          granularity: resolveGranularity(options),
        });

        let boundaries = [];
        let cursor = 0;

        this.adoptText = function (text) {
          const value = String(text || '');
          boundaries = [0];
          cursor = 0;

          for (const segment of segmenter.segment(value)) {
            const boundary = segment.index + segment.segment.length;
            if (boundary > boundaries[boundaries.length - 1]) {
              boundaries.push(boundary);
            }
          }

          if (boundaries[boundaries.length - 1] !== value.length) {
            boundaries.push(value.length);
          }
        };

        this.first = function () {
          cursor = 0;
          return boundaries[cursor] ?? -1;
        };

        this.next = function () {
          if (cursor + 1 >= boundaries.length) {
            return -1;
          }
          cursor += 1;
          return boundaries[cursor];
        };

        this.current = function () {
          return boundaries[cursor] ?? -1;
        };

        this.breakType = function () {
          return 'none';
        };
      }

      window.Intl.v8BreakIterator = SegmenterBreakIterator;
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
