name: Enforce promotion flow

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - uat
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-source:
    name: Validate PR source branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch progression
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          echo "Validating PR source: ${HEAD_REF} -> ${BASE_REF}"

          if [[ "${BASE_REF}" == "uat" && "${HEAD_REF}" != "development" ]]; then
            echo "❌ Only 'development' can be merged into 'uat'."
            exit 1
          fi

          if [[ "${BASE_REF}" == "main" && "${HEAD_REF}" != "uat" ]]; then
            echo "❌ Only 'uat' can be merged into 'main'."
            exit 1
          fi

          echo "✅ Branch progression rule passed."
